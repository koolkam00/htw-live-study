name: Fast-start analysis

on:
  pull_request:
    paths:
      - 'analysis/build_fast_start.py'
      - 'analysis/test_fast_start.py'
      - 'analysis/build_fast_start_all.py'
      - 'analysis/test_fast_start_all.py'
      - 'public/data/fast-start/**'
      - 'public/data/runners/**'
      - 'analysis/release.json'
      - 'scripts/verify-fast-start.cjs'
      - 'scripts/verify-fast-start-all.cjs'
      - '.github/workflows/fast-start.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r analysis/requirements.txt
      - name: Test opening thresholds and slowdown calculations
        run: python -m unittest discover -s analysis -p 'test_fast_start*.py'
      - name: Recalculate from the exact published runner data
        run: python analysis/build_fast_start.py --output "$RUNNER_TEMP/fast-start/evidence.json"
      - name: Independently reconcile the recalculated outcomes
        run: node scripts/verify-fast-start.cjs --input "$RUNNER_TEMP/fast-start/evidence.json"
      - name: Recalculate all eligible finishes without earlier history
        run: python analysis/build_fast_start_all.py --output "$RUNNER_TEMP/fast-start/all-finishers.json"
      - name: Independently reconcile the all-finisher outcomes
        run: node scripts/verify-fast-start-all.cjs --input "$RUNNER_TEMP/fast-start/all-finishers.json"
      - uses: actions/upload-artifact@v4
        with:
          name: fast-start-evidence
          path: ${{ runner.temp }}/fast-start/*.json
          if-no-files-found: error
          retention-days: 30
