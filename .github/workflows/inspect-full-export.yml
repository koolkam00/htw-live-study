name: Inspect complete private marathon export

on:
  pull_request:
    paths:
      - 'analysis/download_release.py'
      - 'analysis/inspect_export.py'
      - '.github/workflows/inspect-full-export.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Private export release tag (blank uses analysis/release.json)
        required: false
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      github.repository == 'koolkam00/htw-live-study' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r analysis/requirements.txt
      - name: Download and verify FULL privately
        env:
          GH_TOKEN: ${{ github.token }}
          PACING_RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: python analysis/download_release.py --bundle FULL --output "$RUNNER_TEMP/pacing-full-private" --tag "$PACING_RELEASE_TAG"
      - name: Inspect every table and column without exporting runner rows
        run: python analysis/inspect_export.py --input "$RUNNER_TEMP/pacing-full-private" --output "$RUNNER_TEMP/pacing-full-inspection"
      - uses: actions/upload-artifact@v4
        with:
          name: pacing-full-export-inspection
          path: ${{ runner.temp }}/pacing-full-inspection/
          if-no-files-found: error
          retention-days: 7
